<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console professeur – Mini-entreprises · Technicien en comptabilité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@700&family=Playfair+Display:ital,wght@1,700&family=Fredoka:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220; --panel:#121B2C; --panel2:#182438; --panel3:#213150;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --text:#EEF2F8; --muted:#A3AFC4; --dim:#71809A;
  --gold:#E3B85C; --gold2:#F6D88F; --steel:#7CB0FF; --mint:#4FD69C; --coral:#FF6F6F; --amber:#FFB454; --violet:#B48CFF;
  --paper:#F6F1E7; --paper2:#EDE5D4; --paper-ink:#1B2233; --paper-muted:#5B6478; --paper-line:#D6CDBB;
  --brand:#2F6FED; --on-brand:#ffffff;
  --r:14px; --r-lg:22px;
  --display:'Bricolage Grotesque','Segoe UI',Arial,sans-serif; --ui:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:var(--ink);color:var(--text);min-height:100vh;font-size:16px;line-height:1.5;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:3px}
[hidden]{display:none!important}
b,strong{font-weight:600}
h1,h2,h3,h4,h5{font-family:var(--display);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.grid-bg::after{content:'';position:absolute;inset:-20% -10% auto;height:70vh;background:radial-gradient(50% 60% at 20% 0%,rgba(227,184,92,.14),transparent 70%),radial-gradient(40% 50% at 85% 10%,rgba(124,176,255,.12),transparent 70%)}
.money{font-family:var(--mono)}

/* ═══ Coquille : rail de navigation + contenu ═══ */
#app{position:relative;z-index:2;display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:rgba(11,18,32,.6);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .lg{width:38px;height:38px;border-radius:10px;background:var(--gold);color:#2b1d02;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.brand b{display:block;font-family:var(--display);font-size:15px;line-height:1.1} .brand small{color:var(--muted);font-size:11.5px}
.navlab{font-size:11.5px;color:var(--dim);padding:14px 10px 4px;font-weight:600}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer}
.nv:hover{background:rgba(255,255,255,.05);color:var(--text)} .nv.on{background:rgba(227,184,92,.12);color:var(--text);font-weight:600}
.nv .i{width:22px;text-align:center;font-size:16px}
.rail .foot{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.5}
main{padding:18px 28px 70px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.src{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)} .dot.demo{background:var(--gold);box-shadow:0 0 10px var(--gold)} .dot.off{background:var(--coral);box-shadow:none}
.tb-r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1.5px solid transparent;font-weight:600;font-size:14px;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-main{background:var(--gold);color:#2b1d02} .btn-ghost{background:transparent;border-color:var(--line2);color:var(--text)} .btn-ghost.on{border-color:var(--mint);color:var(--mint)}
.btn-ghost:hover{background:rgba(255,255,255,.05)}
.spin{width:14px;height:14px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ Blocs ═══ */
.sec-head{margin-bottom:20px}
.kick{font-size:13px;color:var(--muted);margin-bottom:6px} .kick b{color:var(--gold);font-weight:500}
.h{font-size:clamp(28px,3.2vw,40px);margin-bottom:8px}
.lead{color:var(--muted);max-width:76ch;font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;overflow-x:auto}
.panel h3{font-size:17px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.card.tight{padding:16px 18px}
.card h3{font-size:17px;margin-bottom:10px}
.sub{font-family:var(--display);font-size:16px;font-weight:600;margin:18px 0 10px}
.help{font-size:13.5px;color:var(--muted);margin-top:6px}
.note{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:rgba(124,176,255,.08);border:1px solid rgba(124,176,255,.25);font-size:15px;margin:14px 0}
.note .i{font-size:22px;line-height:1;flex:none}
.note.gold{background:rgba(227,184,92,.08);border-color:rgba(227,184,92,.3)}
.ask{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(227,184,92,.1),rgba(124,176,255,.07));border:1px solid rgba(227,184,92,.3);margin-top:20px;font-size:15.5px}
.ask .q{font-size:24px;flex:none} .ask b{color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,var(--gold))}
.kpi .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;margin:4px 0 2px} .kpi .l{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bar{display:grid;grid-template-columns:26px 1fr 1.4fr auto;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.bar .e{font-size:18px;text-align:center} .bar .track{height:12px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;display:block} .bar .fill{display:block;height:100%;background:var(--steel);border-radius:999px;transition:width .6s}
.bar .v{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap} .legend{font-size:14px;display:grid;gap:6px} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px} .chip{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.list th.sortable{cursor:pointer} table.list th.sortable:hover{color:var(--text)} table.list th.on{color:var(--gold2)}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td.n,table.list th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.list tr:hover td{background:rgba(255,255,255,.025)}
.who{display:flex;align-items:center;gap:10px} .who small{display:block;color:var(--dim);font-size:12px}
.prog{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;min-width:90px} .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mint))}
.st{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);white-space:nowrap}
.st.termine{color:var(--mint);border-color:rgba(79,214,156,.5)} .st.en_cours{color:var(--amber);border-color:rgba(255,180,84,.5)} .st.reinitialise{color:var(--steel);border-color:rgba(124,176,255,.5)} .st.ancien{color:var(--dim)}
.link{background:none;border:0;color:var(--steel);cursor:pointer;text-decoration:underline;font-size:14px}
.empty{padding:22px;text-align:center;color:var(--dim);font-size:14px;border:1px dashed var(--line2);border-radius:var(--r)}
.tiles{display:grid;gap:8px;margin-top:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.tile:hover{border-color:var(--line2);background:var(--panel3)}
.tile .nm{display:block;font-size:15px;line-height:1.1} .tile small{color:var(--muted);font-size:12px} .tile .enc{display:block;font-size:11.5px;color:var(--amber)}
.cols{display:grid;gap:14px} .col{border-top:4px solid var(--c1,var(--gold))} .col h3{font-size:17px} .col .slog{color:var(--muted);font-size:13.5px;font-style:italic;display:block;margin-bottom:8px}
.col .def{font-size:14px;color:var(--muted);margin-bottom:10px} .col .refs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px} .col .ref{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06)}
.col .count{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px} .col .count b{font-family:var(--mono);font-size:26px;color:var(--c1,var(--gold))} .col .count span{font-size:13px;color:var(--muted)}
.chain{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap} .chain>div{flex:1;min-width:160px;padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)} .chain b{display:block;font-family:var(--display)} .chain small{color:var(--muted)} .chain .arr{color:var(--dim);font-size:22px}
.pres-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.arrow{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel);color:var(--text);cursor:pointer;font-size:18px}
.pos{font-family:var(--mono);font-size:13px;color:var(--muted)}
#selEleve{padding:9px 12px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel);color:var(--text);min-width:300px}
#selEleve,#selBilan{background:#1b1233} #selEleve option,#selBilan option{background:#1b1233;color:#fff}
.pres{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.stage{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#0E1A2E}
.who-big{display:flex;align-items:center;gap:16px;margin-bottom:10px} .dn{font-size:30px;line-height:1.1} .sl{color:var(--muted);font-size:14px}
.student{font-family:var(--display);font-size:18px;margin:8px 0 10px} .student span{display:block;font-family:var(--ui);font-size:13px;color:var(--muted);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px} .tag{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.kpi-row .k{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)} .kpi-row .k span{display:block;font-size:12px;color:var(--muted)} .kpi-row .k b{display:block;font-family:var(--mono);font-size:19px;margin-top:3px}
.coh{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap} .coh.ok{background:rgba(79,214,156,.15);color:var(--mint)} .coh.warn{background:rgba(255,180,84,.15);color:var(--amber)}
.hl{padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--gold))} .hl span{font-size:12.5px;color:var(--muted);display:block} .hl b{font-family:var(--display);font-size:17px;display:block;margin:2px 0} .hl small{font-family:var(--mono);color:var(--c,var(--gold))}
.stack{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0} .stack .bars2{display:flex;height:16px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.07)} .stack .bars2 i{display:block;height:100%} .stack .v{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.gate{max-width:560px;margin:10vh auto 0;padding:34px}
.gate h2{font-size:34px;margin:8px 0 10px}
.gate label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}
.inp{width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);color:var(--text);font-size:16px}
.err{color:var(--coral);font-size:14px;margin-top:8px}
.fade-in{animation:fi .4s ease both} @keyframes fi{from{opacity:0;transform:translateY(8px)}}
.notice{padding:26px;border-radius:var(--r-lg);border:1px dashed var(--line2);color:var(--muted);font-size:15px;max-width:70ch}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.docgrid .paper{font-size:13px;padding:18px 20px} .docgrid .paper dl{font-size:12.5px} .docgrid .paper .ph h4{font-size:14px}
/* projection : plus grand, sans menu */
body.projo{font-size:19px} body.projo #app{grid-template-columns:minmax(0,1fr)} body.projo .rail{display:none} body.projo main{padding:14px 40px 60px;max-width:1500px;margin:0 auto} body.projo .h{font-size:46px} body.projo .lead{font-size:19px;max-width:none} body.projo .kpi .n{font-size:34px} body.projo .dn{font-size:40px} body.projo table.list{font-size:17px} body.projo .bar{font-size:17px} body.projo .tile .nm{font-size:18px}
@media (max-width:1180px){.pres,.grid2,.docgrid{grid-template-columns:minmax(0,1fr)} .grid3,.cols{grid-template-columns:repeat(2,minmax(0,1fr))!important} main{padding:14px 18px 60px}}
@media (max-width:820px){#app{grid-template-columns:minmax(0,1fr)} .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)} .grid3,.cols{grid-template-columns:minmax(0,1fr)!important} .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))} main{padding:14px 14px 60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ═══ Tableaux chiffrés ═══ */
table.led{width:100%;border-collapse:collapse;font-size:14.5px}
table.led th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2)}
table.led td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.led td.n,table.led th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.led tr.tot td{font-weight:700;border-top:2px solid var(--line2);border-bottom:0;background:rgba(255,255,255,.03)}
table.led tr.on td{background:rgba(227,184,92,.1)}
table.led td.neg,.neg{color:var(--coral)} .pos{color:var(--mint)}
.money{font-family:var(--mono)}

/* bilan en deux colonnes */
.bilan{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.bilan .col{padding:0} .bilan .col+.col{border-left:1px solid var(--line2)}
.bilan h5{font-family:var(--display);font-size:14px;padding:10px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:700}
.bilan h5 small{font-family:var(--ui);font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.bilan .l{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;font-size:14px;border-bottom:1px dashed var(--line)}
.bilan .l .k{color:var(--muted)} .bilan .l .k b{color:var(--text);display:block;font-weight:500}
.bilan .l .v{font-family:var(--mono);white-space:nowrap}
.bilan .l.vide{color:var(--dim);font-style:italic}
.bilan .sect{font-size:11.5px;color:var(--dim);padding:8px 14px 2px;font-weight:600}
.bilan .t{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;font-family:var(--mono);background:rgba(227,184,92,.1);border-top:1px solid var(--line2)}
.bilan-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.bilan-foot b{color:var(--mint)}

/* jauge d'autonomie */
.gauge{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;margin:8px 0 4px}
.gauge i{position:absolute;inset:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--coral),var(--amber) 35%,var(--mint) 70%);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge-l{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.big-n{font-family:var(--mono);font-size:34px;font-weight:600;line-height:1}
.big-n small{font-family:var(--ui);font-size:14px;color:var(--muted);font-weight:400}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.stat3.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat3 .s{padding:14px 16px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--line)}
.stat3 .s span{display:block;font-size:12.5px;color:var(--muted)} .stat3 .s b{display:block;font-family:var(--mono);font-size:20px;margin-top:4px}

/* barres d'étude de marché */
.bars{display:grid;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:12px;font-size:14px}
.bar .track{height:14px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden} .bar .fill{display:block;height:100%;border-radius:999px;background:var(--steel);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .v{font-family:var(--mono);text-align:right}

/* ═══ Documents « papier » ═══ */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.06);position:relative;overflow:hidden;font-size:14.5px}
.paper::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");opacity:.08;mix-blend-mode:multiply;pointer-events:none}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:14px}
.paper .ph h4{font-size:17px;font-weight:800;letter-spacing:0} .paper .ph small{display:block;color:var(--paper-muted);font-size:12px;font-weight:400}
.paper .ph .ref{font-family:var(--mono);font-size:11.5px;color:var(--paper-muted);text-align:right}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.paper dt{color:var(--paper-muted)} .paper dd{font-weight:500} .paper dd .num{font-family:var(--mono);background:#fff;padding:2px 8px;border-radius:5px;border:1px solid var(--paper-line);letter-spacing:.04em}
.paper .foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--paper-line);font-size:12px;color:var(--paper-muted);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

const nbFondateurs = () => S.direction === "plusieurs" ? S.nbAssocies : 1;
// — argent —
const fraisCreation = () => S.direction ? FRAIS[S.direction] : 0;
const capital = () => S.apport ? S.apport * nbFondateurs() : 0;
const loyer = () => empl() ? empl().loyer : 0;
const garantie = () => loyer() * MOIS_GARANTIE;
const empruntMax = () => Math.floor(capital() * (1 - PART_PROPRE_MIN) / PART_PROPRE_MIN / 1000) * 1000;   // fonds propres ≥ 40 % du total
const empruntAccepte = () => S.emprunt != null && S.emprunt <= empruntMax();
const emprunt = () => (S.emprunt && empruntAccepte()) ? S.emprunt : 0;
const mensualite = () => { const P = emprunt(); if (!P) return 0; const i = TAUX / 12; return r2(P * i / (1 - Math.pow(1 + i, -DUREE_MOIS))); };
const interetsTotaux = () => r2(mensualite() * DUREE_MOIS - emprunt());
const tresorerie = () => capital() + emprunt() - fraisCreation() - garantie();
const chargesMensuelles = () => (S.emplacement ? loyer() + CHARGES_AUTRES : 0) + mensualite();
const autonomie = () => chargesMensuelles() > 0 ? Math.floor(tresorerie() / chargesMensuelles()) : null;
const totalBilan = () => capital() + emprunt();
const financementPret = () => !!S.direction && !!S.apport && S.emprunt != null && empruntAccepte() && tresorerie() >= TRESO_MIN;
function nomDepuisEmail(email){
  const cap = s => s.split("-").map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join("-");
  const parts = email.split("@")[0].split(".");
  return { prenom: cap(parts[0] || ""), nom: parts.slice(1).map(cap).join(" ") };
}
const lum = (hex) => { const n = parseInt(hex.slice(1),16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255))/255; };
function setBrand(hex){
  const r = document.documentElement.style;
  if (!hex){ r.removeProperty("--brand"); r.removeProperty("--on-brand"); return; }
  r.setProperty("--brand", hex); r.setProperty("--on-brand", lum(hex) > .62 ? "#1D1F33" : "#FFFFFF");
}
function texteSurMarque(){
  const fond = S.couleur || "#2F6FED", c2 = S.couleur2;
  if (c2 && Math.abs(lum(c2) - lum(fond)) > .35) return c2;
  return lum(fond) > .62 ? "#1D1F33" : "#FFFFFF";
}
const nomSurBlanc = () => (S.couleur && lum(S.couleur) > .7) ? "#1D1F33" : (S.couleur || "#2F6FED");
function genBCE(){
  const base = "1" + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const n = base + String(97 - (parseInt(base,10) % 97)).padStart(2,"0");
  return `${n.slice(0,4)}.${n.slice(4,7)}.${n.slice(7)}`;
}
function mod97(str){ let r = 0; for (const ch of str) r = (r*10 + +ch) % 97; return r; }
function genIBAN(){
  const bank = ["001","063","068","310","363","523","732","751"][Math.floor(Math.random()*8)];
  const b10 = bank + String(Math.floor(Math.random()*1e7)).padStart(7,"0");
  const bban = b10 + String(mod97(b10) || 97).padStart(2,"0");
  const iban = "BE" + String(98 - mod97(bban + "111400")).padStart(2,"0") + bban;
  return iban.match(/.{1,4}/g).join(" ");
}

function bilanData(){
  const actif = [], passif = [];
  if (fraisCreation()) actif.push({ libelle:"Frais d'établissement (frais de création)", court:"Frais d'établissement", montant:fraisCreation(), rubrique:"Actif immobilisé" });
  if (garantie()) actif.push({ libelle:"Garantie locative (créance)", court:"Garantie locative", montant:garantie(), rubrique:"Actif immobilisé" });
  actif.push({ libelle:"Banque (trésorerie)", court:"Banque", montant:tresorerie(), rubrique:"Actif circulant" });
  passif.push({ libelle:"Capital", court:"Capital", montant:capital(), rubrique:"Fonds propres" });
  if (emprunt()) passif.push({ libelle:"Emprunt bancaire", court:"Emprunt", montant:emprunt(), rubrique:"Dettes à plus d'un an" });
  return { actif, passif, total: totalBilan() };
}

function jsonp(params, timeout = 40000){
  return new Promise((resolve, reject) => {
    const cb = "cbJ" + Date.now() + Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    let fini = false;
    const fin = () => { fini = true; clearTimeout(t); s.remove(); window[cb] = function(){}; setTimeout(() => { try { delete window[cb]; } catch(e) {} }, 120000); };
    const t = setTimeout(() => { if (!fini){ fin(); reject(new Error("timeout")); } }, timeout);
    window[cb] = (d) => { if (fini) return; fin(); resolve(d); };
    s.onerror = () => { if (!fini){ fin(); reject(new Error("reseau")); } };
    s.src = CONFIG.ENDPOINT_URL + "?" + new URLSearchParams(Object.assign({}, params, {callback:cb, _:Date.now()})).toString();
    document.body.appendChild(s);
  });
}

function donut(parts, size = 170, label = ""){
  const tot = parts.reduce((s,p) => s + p.v, 0) || 1, r = 62, c = 2*Math.PI*r; let off = 0;
  const arcs = parts.filter(p => p.v > 0).map(p => { const len = p.v / tot * c, a = `<circle cx="85" cy="85" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`; off += len; return a; }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 170 170"><circle cx="85" cy="85" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="22"/>${arcs}
    <text x="85" y="84" text-anchor="middle" font-size="30" fill="#fff" style="font-family:'IBM Plex Mono',monospace">${parts.reduce((s,p) => s + p.v, 0)}</text><text x="85" y="104" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.6)" style="font-family:'IBM Plex Sans',Arial">${label}</text></svg>`;
}

function chartBanque(sem, debut){
  const pts = [debut].concat(sem.map(s => s.banqueFin)); if (pts.some(p => p == null)) return "";
  const min = Math.min(0, ...pts), max = Math.max(...pts) * 1.08 || 1, W = 520, H = 150, L = 54, R_ = 14, T = 16, Bt = 26, x = (i) => L + i * (W - L - R_) / (pts.length - 1), y = (v) => T + (H - T - Bt) * (1 - (v - min) / (max - min));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><path d="${pts.map((v, i) => `${i ? "L" : "M"}${x(i)} ${y(v)}`).join(" ")}" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>${pts.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#34d399"/><text x="${x(i)}" y="${y(v) - 9}" font-size="10.5" text-anchor="middle" fill="#fff" style="font-family:'IBM Plex Mono',monospace">${euro0(v)}</text><text x="${x(i)}" y="${H - 8}" font-size="11" text-anchor="middle" fill="rgba(255,255,255,.6)">${i ? "S" + i : "Début"}</text>`).join("")}</svg>`;
}
const stM = (m) => m ? `<span class="st ${m.statut}">${m.fini ? "Terminée" : esc(STATUTS[m.statut] || m.statut)}</span>` : `<span class="st" style="color:var(--dim)">–</span>`;

V.ventes = () => {

  const F = L.filter(E => E.m3.fini && E.m3.resultat != null), maxCA = Math.max(1, ...F.map(E => E.m3.ca || 0));
  const best = F.slice().sort((a, b) => b.m3.resultat - a.m3.resultat)[0], ca = F.slice().sort((a, b) => b.m3.ca - a.m3.ca)[0], dormant = F.slice().sort((a, b) => (b.m3.stockFinal || 0) - (a.m3.stockFinal || 0))[0], nego = F.filter(E => E.m3.devis && E.m3.devis.etat === "accepte" && E.m3.devis.tentatives === 1).length;

      <td class="n">×${coefMoy(E)}</td><td class="n">${m.ca != null ? euro0(m.ca) : "–"}</td><td class="n" style="color:${m.resultat == null ? "" : m.resultat >= 0 ? "var(--mint)" : "var(--coral)"}">${m.resultat != null ? euro0(m.resultat) : "–"}</td>

      <td>${ex && ex.reussi != null ? (ex.duPremierCoup ? `<span class="coh ok">juste du 1er coup</span>` : ex.reussi ? `<span class="coh ok">juste au 2e</span>` : `<span class="coh warn">complétée</span>`) : "–"}</td>

const CLE_CACHE = "mini-entreprise-compta-prof-cache-v4";
function appliquerDonnees(r, maj){
  APP.liste = (r.dossiers || []).map(d => { try { return normaliser(d); } catch(e) { return null; } }).filter(Boolean)
    .sort((a, b) => (a.nomEleve + a.prenom).localeCompare(b.nomEleve + b.prenom, "fr"));
  APP.config = r.config || null; APP.maj = maj || new Date();
  try { localStorage.setItem(CLE_CACHE, JSON.stringify({ r, maj: APP.maj.toISOString() })); } catch(e) {}
}
async function charger(premiere){
  if (APP.busy) return;
  APP.busy = true; APP.err = ""; render();
  try {
    const r = await jsonp({ action:"eleves", cle:APP.cle }, 45000);
    if (!r || !r.ok){ APP.busy = false; APP.err = r && r.erreur === "cle_invalide" ? "Clé professeur incorrecte." : "Réponse inattendue du Google Sheet."; if (premiere){ APP.source = null; } render(); return; }
    appliquerDonnees(r, new Date());
    try { localStorage.setItem(CONFIG.CLE_STOCKAGE, APP.cle); } catch(e) {}
    APP.source = "live"; APP.busy = false; render();
  } catch(e) {
    APP.busy = false;
    const cache = (() => { try { return JSON.parse(localStorage.getItem(CLE_CACHE) || "null"); } catch(x) { return null; } })();
